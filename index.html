<style>

  #dashBtn.on { background:radial-gradient(circle at 35% 30%, #8ec9ff, #2a7ac2); transform:scale(.93); }

<script type="module">
import * as THREE from 'three';

/* ================= 基本 ================= */
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const rnd = (a,b)=>a+Math.random()*(b-a);

const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
$('gl').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd6e8);
scene.fog = new THREE.Fog(0xbfd6e8, 55, 150);
const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 400);
const amb = new THREE.AmbientLight(0xffffff, 0.75);
scene.add(amb);
const sun = new THREE.DirectionalLight(0xfff2d8, 1.5);
sun.position.set(30, 50, 20);
scene.add(sun);
// 空の色（16:00→19:00で夕焼け→夜へ。G参照は呼び出し時のみ）
const SKY_STOPS = [
  { m: 960,  bg: new THREE.Color(0xbfd6e8), sun: new THREE.Color(0xfff2d8), si: 1.5,  ai: 0.75 },
  { m: 1080, bg: new THREE.Color(0xf2b879), sun: new THREE.Color(0xff9448), si: 1.05, ai: 0.55 },
  { m: 1120, bg: new THREE.Color(0x5a5f8a), sun: new THREE.Color(0xb06a8c), si: 0.5,  ai: 0.38 },
  { m: 1140, bg: new THREE.Color(0x232a44), sun: new THREE.Color(0x7a86b8), si: 0.3,  ai: 0.30 },
];
function applySky(){
  const m = G.clockMin;
  let a = SKY_STOPS[0], b = SKY_STOPS[0];
  if (m >= SKY_STOPS[SKY_STOPS.length - 1].m){ a = b = SKY_STOPS[SKY_STOPS.length - 1]; }
  else for (let i = 0; i < SKY_STOPS.length - 1; i++){ if (m >= SKY_STOPS[i].m && m <= SKY_STOPS[i + 1].m){ a = SKY_STOPS[i]; b = SKY_STOPS[i + 1]; break; } }
  const k = a === b ? 0 : (m - a.m) / (b.m - a.m);
  scene.background.lerpColors(a.bg, b.bg, k);
  scene.fog.color.copy(scene.background);
  sun.color.lerpColors(a.sun, b.sun, k);
  sun.intensity = a.si + (b.si - a.si) * k;
  amb.intensity = a.ai + (b.ai - a.ai) * k;
}
addEventListener('resize', ()=>{ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const matCache = {};
function M(color){ if(!matCache[color]) matCache[color] = new THREE.MeshLambertMaterial({ color }); return matCache[color]; }
function box(parent, w,h,d, color, x,y,z, ry=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), M(color));
  m.position.set(x,y,z); m.rotation.y = ry; parent.add(m); return m;
}
function cyl(parent, rt,rb,h, color, x,y,z, seg=10){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), M(color));
  m.position.set(x,y,z); parent.add(m); return m;
}
function sph(parent, r, color, x,y,z, sx=1,sy=1,sz=1){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,12,10), M(color));
  m.position.set(x,y,z); m.scale.set(sx,sy,sz); parent.add(m); return m;
}
function signTex(lines, bg, fg, w=256, h=128){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0,0,w,h);
  g.strokeStyle = fg; g.lineWidth = 6; g.strokeRect(6,6,w-12,h-12);
  g.fillStyle = fg; g.textAlign='center'; g.textBaseline='middle';
  const fs = lines.length>1 ? h*0.34 : h*0.5;
  g.font = '900 ' + fs + 'px sans-serif';
  lines.forEach((t,i)=> g.fillText(t, w/2, h*(lines.length>1 ? (0.3+i*0.4) : 0.52)));
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function signBoard(parent, lines, bg, fg, w, h, x,y,z, ry=0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshLambertMaterial({ map: signTex(lines,bg,fg) }));
  m.position.set(x,y,z); m.rotation.y = ry; parent.add(m); return m;
}

/* ================= 地形 ================= */
// 神門通りは上り坂（後半きつい）、勢溜から先は下り参道、境内は平坦
function groundY(z){
  if (z >= 0) return 0;
  if (z > -170) return lerp(0, 3.0, -z/170);
  if (z > -340) return lerp(3.0, 8.5, (-z-170)/170);
  if (z > -385) return lerp(8.5, 6.0, (-z-340)/45);
  return 6.0;
}
function widthAt(z){ // プレイヤーの可動幅（半分）
  if (z > -338) return 5.4;        // 神門通り
  if (z > -378) return 6.4;        // 勢溜〜祓橋
  if (z > -546) return 9.0;        // 松の参道〜銅鳥居（中央が通れない分、道幅を広く）
  return 13;                        // 拝殿前広場
}
function buildGround(){
  const g = new THREE.Group(); scene.add(g);
  // 大地リボン
  const pts = [];
  for (let z = 16; z >= -606; z -= 4) pts.push(z);
  const geo = new THREE.BufferGeometry();
  const verts = [], cols = [], idx = [];
  const cStreet = new THREE.Color(0x8a8578), cShrine = new THREE.Color(0xb8ab90), cTmp = new THREE.Color();
  pts.forEach((z,i)=>{
    const y = groundY(z);
    verts.push(-46, y-0.05, z, 46, y-0.05, z);
    cTmp.copy(z > -340 ? cStreet : cShrine);
    cols.push(cTmp.r,cTmp.g,cTmp.b, cTmp.r,cTmp.g,cTmp.b);
    if (i>0){ const a=(i-1)*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  });
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors:true })));
  // 神門通りの道（石畳：車道も歩道も明るい石舗装）
  strip(g, -4.6, 4.6, 14, -340, 0x9c988f, 0.03);
  strip(g, -6.6, -4.6, 14, -340, 0xa8a49a, 0.025);
  strip(g,  4.6,  6.6, 14, -340, 0xa8a49a, 0.025);
  // 車道の両端の白線（坂に沿わせる）
  strip(g, -4.5, -4.28, 14, -338, 0xeeece6, 0.042);
  strip(g,  4.28,  4.5, 14, -338, 0xeeece6, 0.042);
  // 石畳の目地（横線）
  for (let z = 6; z >= -336; z -= 8){
    const seg = box(g, 9.2, 0.012, 0.18, 0x8b887f, 0, (groundY(z) + groundY(z-0.2))/2 + 0.036, z);
    seg.rotation.x = Math.atan2(groundY(z-3.4) - groundY(z), 3.4);
  }
  // 勢溜の広場
  strip(g, -9, 9, -336, -352, 0xa79b82, 0.03);
  // 鳥居の前を横切る道路（東西）
  strip(g, -46, 46, -330.5, -340, 0x4c4d52, 0.045);
  for (let x = -44; x <= 44; x += 7){ // 横断道路のセンターライン
    box(g, 3.4, 0.03, 0.28, 0xe8e4da, x, groundY(-335.2) + 0.06, -335.2);
  }
  for (let x = -2.75; x <= 2.75; x += 1.1){ // 横断歩道
    strip(g, x, x + 0.55, -331.2, -339.3, 0xf2f0ea, 0.058);
  }
  // スクランブル交差点：通りを横切る横断歩道（南北）＋斜め横断
  for (let x = -5.8; x <= 5.8; x += 1.1){
    strip(g, x, x + 0.55, -329.7, -327.3, 0xf2f0ea, 0.05);
    strip(g, x, x + 0.55, -343.3, -340.9, 0xf2f0ea, 0.05);
  }
  for (const sgn of [1, -1]){
    for (let i = 0; i < 7; i++){
      const t = 0.1 + i * 0.135;
      const cx = sgn * lerp(-6.0, 6.0, t), cz = lerp(-331.2, -339.3, t);
      const d = box(g, 0.55, 0.03, 2.1, 0xf2f0ea, cx, groundY(cz) + 0.06, cz);
      d.rotation.y = Math.atan2(sgn * 12, -8.1);
    }
  }
  // 下り参道〜松の参道（砂利）
  strip(g, -9.4, 9.4, -352, -550, 0xc2b498, 0.03);
  // 参道の中央＝神様の道（少し明るい石畳調で区別）
  strip(g, -1.35, 1.35, -390, -546, 0xd9c9a4, 0.05);
  strip(g, -1.35, 1.35, -546, -563, 0xd9c9a4, 0.05); // 拝殿前も神様の通り道（賽銭箱の前は入っていいので線は引かない）
  strip(g, -1.35, 1.35, -352, -390, 0xcbbd9c, 0.04);
  // 拝殿前広場
  strip(g, -17, 17, -546, -572, 0xc2b498, 0.03);
  // 祓橋の下の水
  const wtr = new THREE.Mesh(new THREE.PlaneGeometry(15, 3.4), M(0x4d7fa8));
  wtr.rotation.x = -Math.PI/2; wtr.position.set(0, groundY(-370)-0.12, -370); g.add(wtr);
}
function strip(parent, x0, x1, z0, z1, color, lift){
  const pts = [];
  for (let z = z0; z >= z1; z -= 4) pts.push(z);
  if (pts[pts.length-1] !== z1) pts.push(z1);
  const geo = new THREE.BufferGeometry();
  const verts = [], idx = [];
  pts.forEach((z,i)=>{
    verts.push(x0, groundY(z)+lift, z, x1, groundY(z)+lift, z);
    if (i>0){ const a=(i-1)*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  });
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  parent.add(new THREE.Mesh(geo, M(color)));
}
function gableRoof(parent, w, d, baseY, rise, color, x=0, z=0){
  const geo = new THREE.CylinderGeometry(1, 1, 1, 3, 1);
  geo.rotateX(-Math.PI/2); geo.rotateY(Math.PI/2);
  geo.scale(w, rise/1.5, d/1.732);
  const m = new THREE.Mesh(geo, M(color));
  m.position.set(x, baseY + rise/3, z);
  parent.add(m); return m;
}
buildGround();

/* ================= 鳥居 ================= */
const TORIIS = [];
function torii(x, z, w, h, color, pillarR){
  const g = new THREE.Group(); const y = groundY(z);
  g.position.set(x, y, z); scene.add(g);
  const p1 = cyl(g, pillarR*0.85, pillarR, h, color, -w/2, h/2, 0, 12);
  const p2 = cyl(g, pillarR*0.85, pillarR, h, color,  w/2, h/2, 0, 12);
  p1.rotation.z = 0.03; p2.rotation.z = -0.03;
  const top = box(g, w*2+1.6, h*0.09, pillarR*2.2, color, 0, h + h*0.05, 0);
  top.rotation.z = 0; // 笠木
  const shimaki = box(g, w*1.7, h*0.07, pillarR*1.9, color, 0, h - h*0.02, 0);
  box(g, w*1.25, h*0.07, pillarR*1.5, color, 0, h*0.78, 0); // 貫
  box(g, pillarR*1.1, h*0.22, pillarR*1.1, color, 0, h*0.9, 0); // 額束
  TORIIS.push({ grp: g, z, w, shakeT: 0, metal: z !== 0 });
  return g;
}
function updateToriis(dt){
  for (const t of TORIIS){
    if (t.shakeT > 0){
      t.shakeT -= dt;
      t.grp.rotation.z = Math.sin(t.shakeT * 26) * 0.05 * Math.max(0, t.shakeT);
      if (t.shakeT <= 0) t.grp.rotation.z = 0;
    }
  }
}

function updateCrossCars(dt){
  // 車は止まらない（横断歩道でも減速しない）
  for (const c of CROSS_CARS){
    c.speed = c.cruise;
    c.x += c.dir * c.speed * dt;
    if (c.x > 52) c.x = -52;
    if (c.x < -52) c.x = 52;
    c.grp.position.x = c.x;
    c.grp.position.y = groundY(c.z);
    // 接触＝一発で終わる
    if (G.phase === 'run' && c.speed > 3 && Math.abs(P.x - c.x) < 1.9 && Math.abs(P.z - c.z) < 1.2) hitByCar(c);
  }
}
function hitByCar(c){
  G.phase = 'dead'; G.deadT = 0; G.endKind = 'car'; G.hitCar = c;
  P.vx = 0; P.vz = 0;
  P.kbx = c.dir * 13; P.kbz = rnd(-1, 1);
  P.flyV = 8; P.flyY = 0.02; P.flyRot = 0; P.spin = rnd(6, 9) * (Math.random() < 0.5 ? -1 : 1);
  $('punchBtn').style.display = 'none';
  $('dashBtn').style.display = 'none';
  G.dashHeld = false;
  $('stickL').style.display = 'none';
  noiseBurst(0.3, 400, 0.3); tone(70, 0.5, 'sine', 0.2, -20);
}

const RUNNER_P = [ 0.10, 0.12, 0.14, 0.17 ];
const SOUTH_P = [ 0.76, 0.78, 0.80, 0.82 ];
function spawnNPC(n, initial){
  const st = crowdStage();
  const ahead = initial ? rnd(16, 95) : rnd(SPAWN_AHEAD[st][0], SPAWN_AHEAD[st][1]);
  n.z = P.z - ahead;
  if (n.z < -564) n.z = -564 + rnd(0, 6);
  // 参道では間引く＆同じ深さに固めない（両側のレーンが同時に壁にならないように）
  if (!initial && n.z < -376){
    n.z -= rnd(10, 26);
    if (n.z < -564) n.z = -564 + rnd(0, 6);
    for (let tries = 0; tries < 2; tries++){
      let cnt = 0;
      for (const o of NPCS){ if (o !== n && o.z < -376 && Math.abs(o.z - n.z) < 3.5) cnt++; }
      if (cnt < 2) break;
      n.z -= rnd(8, 16);
      if (n.z < -564) n.z = -564 + rnd(0, 6);
    }
  }
  n.dir = Math.random() < SOUTH_P[st] ? 1 : -1; // 大半は帰り道（南行）
  const w = widthAt(n.z);
  let x = rnd(-w+0.5, w-0.5);
  if (n.z < -376 && Math.abs(x) < 1.8) x = Math.sign(x || 1) * rnd(1.9, w-0.5); // 参道では中央を空ける
  n.laneX = x; n.x = x;
  n.runner = Math.random() < RUNNER_P[crowdStage()]; // たまに走ってる参拝客（奥ほど多い）
  n.speed = n.runner ? rnd(7.5, 9.5) : (n.dir > 0 ? rnd(2.5, 4.2) : rnd(1.9, 3.1));
  n.phase = rnd(0, 6.28);
  n.stumbleT = 0; n.tipT = 0; n.kbx = 0; n.kbz = 0; n.flyY = 0; n.flyV = 0; n.flyRot = 0; n.spin = 0;

let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state==='suspended') AC.resume(); return AC; }
function tone(freq, dur, type='sine', vol=0.15, slide=0){
  try{
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq+slide), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }catch(e){}
}
function noiseBurst(dur=0.07, freq=1800, vol=0.2){
  try{
    const a = ac(), len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(f).connect(g).connect(a.destination); src.start();
  }catch(e){}
}
const sndBump = ()=>{ tone(140, 0.12, 'sine', 0.22, -60); noiseBurst(0.05, 500, 0.12); };
const sndWarn = ()=> tone(880, 0.09, 'square', 0.06);
const sndClap = ()=>{ noiseBurst(0.06, 1600, 0.3); setTimeout(()=>noiseBurst(0.05, 1400, 0.18), 30); };
const sndBow  = ()=> tone(520, 0.16, 'sine', 0.08, -140);
const sndBad  = ()=> tone(220, 0.2, 'sawtooth', 0.08, -80);
const sndGoal = ()=>{ tone(660, 0.25, 'sine', 0.14); setTimeout(()=>tone(880, 0.4, 'sine', 0.14), 140); };
addEventListener('pointerdown', () => { if (AC && AC.state === 'suspended') AC.resume(); }, true);

/* ================= 環境音（参拝客のがやがや＋小鳥） ================= */
let ambNodes = null, ambTimer = null;
function startAmb(){
  if (ambNodes) return;
  try{
    const a = ac();
    const len = a.sampleRate * 2;
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++){ const w = Math.random() * 2 - 1; last = (last + 0.03 * w) / 1.03; d[i] = last * 3.2; }
    const src = a.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 620; f.Q.value = 0.45;
    const g = a.createGain(); g.gain.value = 0.04;
    const lfo = a.createOscillator(), lg = a.createGain();
    lfo.frequency.value = 0.13; lg.gain.value = 0.014;
    lfo.connect(lg).connect(g.gain);
    const lfo2 = a.createOscillator(), lg2 = a.createGain();
    lfo2.frequency.value = 0.07; lg2.gain.value = 190;
    lfo2.connect(lg2).connect(f.frequency);
    src.connect(f).connect(g).connect(a.destination);
    src.start(); lfo.start(); lfo2.start();
    ambNodes = { src, lfo, lfo2, g };
    const chirp = () => {
      if (!ambNodes) return;
      try{
        const t0 = a.currentTime + 0.05;
        const n = 2 + Math.floor(Math.random() * 3);
        const base = 2600 + Math.random() * 900;
        let out = a.destination;
        if (a.createStereoPanner){ const pan = a.createStereoPanner(); pan.pan.value = Math.random() * 1.4 - 0.7; pan.connect(a.destination); out = pan; }
        for (let i = 0; i < n; i++){
          const o = a.createOscillator(), og = a.createGain();
          o.type = 'sine';
          const t = t0 + i * 0.11;
          o.frequency.setValueAtTime(base, t);
          o.frequency.exponentialRampToValueAtTime(base * (1.15 + Math.random() * 0.25), t + 0.05);
          o.frequency.exponentialRampToValueAtTime(base * 0.92, t + 0.09);
          og.gain.setValueAtTime(0, t);
          og.gain.linearRampToValueAtTime(0.02, t + 0.015);
          og.gain.linearRampToValueAtTime(0, t + 0.095);
          o.connect(og).connect(out); o.start(t); o.stop(t + 0.1);
        }
      }catch(e){}
      ambTimer = setTimeout(chirp, 2200 + Math.random() * 3800);
    };
    ambTimer = setTimeout(chirp, 900);
  }catch(e){}
}
function stopAmb(){
  if (ambTimer){ clearTimeout(ambTimer); ambTimer = null; }
  if (ambNodes){ try{ ambNodes.src.stop(); ambNodes.lfo.stop(); ambNodes.lfo2.stop(); ambNodes.g.disconnect(); }catch(e){} ambNodes = null; }
}

/* ================= ゲーム状態 ================= */
const G = { phase:'title', time:0, clockMin:960, manners:100, bumps:0, dashBumps:0, resultShown:false, boltT:0, flashT:0, punches:0, toriiPunches:0, centerTicks:0, centerAcc:0, bumpCd:0, warnCd:0, started:false, prayIdx:0, prayMiss:0, endKind:null, godT:0, dashHeld:false, zone:'', toriiSeen:{}, waveSeen:{}, camMode:'title', introT:0, deadT:0, photoCd:3 };
const PRAY_SEQ = ['礼','礼','拍','拍','拍','拍','礼'];
const TORII_ZONES = [
  { z:-338, name:'勢溜' }, { z:-376, name:'松の参道' }, { z:-546, name:'境内' }, { z:-565, name:'拝殿前' },
];
function zoneName(z){
  if (z > -338) return '神門通り';
  if (z > -376) return '勢溜';
  if (z > -546) return '松の参道';
  if (z > -565) return '境内';
  return '拝殿前';
}
const TORII_POPUPS = [
  { z:0, label:'一の鳥居' }, { z:-343, label:'二の鳥居（勢溜）' }, { z:-392, label:'三の鳥居' }, { z:-546, label:'四の鳥居（銅鳥居）' },
];
const WAVE_POPUPS = [
  { z:-170, txt:'人混みが増えてきた' }, { z:-338, txt:'初詣ラッシュ！' }, { z:-470, txt:'身動きが取れない…！' },
];
function popup(text, cls=''){
  const el = document.createElement('div');
  el.className = 'pop ' + cls; el.textContent = text;
  $('popups').appendChild(el);
  setTimeout(()=> el.remove(), 1200);
  while ($('popups').children.length > 3) $('popups').firstChild.remove();
}

const keys = {};
addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; });
addEventListener('keyup',   e=>{ keys[e.key.toLowerCase()] = false; });
const cvs = renderer.domElement;
cvs.addEventListener('pointerdown', e=>{
  if (G.phase !== 'run') return;
  stick.active = true; stick.id = e.pointerId; stick.cx = e.clientX; stick.cy = e.clientY; stick.dx = 0; stick.dy = 0; stick.mag = 0;
  const el = $('stickL');
  el.style.display = 'block';
  el.style.left = (e.clientX - 59) + 'px'; el.style.top = (e.clientY - 59) + 'px';
  el.querySelector('.nub').style.left = '33px'; el.querySelector('.nub').style.top = '33px';
});
addEventListener('pointermove', e=>{
  if (!stick.active || e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.cx, dy = e.clientY - stick.cy;
  const d = Math.hypot(dx, dy), max = 36;
  if (d > max){ dx *= max/d; dy *= max/d; }
  stick.dx = dx/max; stick.dy = dy/max; stick.mag = Math.min(1, d/max);
  const nub = $('stickL').querySelector('.nub');
  nub.style.left = (33 + dx) + 'px'; nub.style.top = (33 + dy) + 'px';
});
function stickEnd(e){
  if (e.pointerId !== stick.id) return;
  stick.active = false; stick.mag = 0; stick.dx = 0; stick.dy = 0;
  $('stickL').style.display = 'none';
}
addEventListener('pointerup', stickEnd);
addEventListener('pointercancel', stickEnd);

/* ================= 殴る ================= */
function punch(){
  if (G.phase !== 'run' || P.punchCd > 0) return;
  P.punchCd = 0.45; P.punchT = 0.28;
  noiseBurst(0.08, 700, 0.22); tone(170, 0.09, 'square', 0.1, -60);
  const fx = -Math.sin(P.angle), fz = -Math.cos(P.angle);
  let best = null, bd = 3.4;
  for (const n of NPCS){
    const dx = n.x - P.x, dz = n.z - P.z;
    const d = Math.hypot(dx, dz);
    if (d < bd && (dx * fx + dz * fz) > 0.15){ best = n; bd = d; }
  }
  // 鳥居の柱も殴れる（近い方を優先）
  let tHit = null, td = 1.9;
  for (const t of TORIIS){
    const d = Math.min(
      Math.hypot(P.x - t.w/2, P.z - t.z),
      Math.hypot(P.x + t.w/2, P.z - t.z));
    if (d < td){ tHit = t; td = d; }
  }
  // 店も殴れる（同じ店を3回殴ると壁が壊れて器物損壊エンド）
  let shopHit = null, shopD = 2.4;
  for (const s of SHOPS){
    if (s.broken) continue;
    const fx2 = Math.sign(s.x) * 7.3, fz2 = clamp(P.z, s.z - 4.5, s.z + 4.5);
    const ddx = fx2 - P.x, ddz = fz2 - P.z, dd = Math.hypot(ddx, ddz);
    if (dd < shopD && (ddx * fx + ddz * fz) > 0){ shopHit = s; shopD = dd; }
  }
  // 賽銭箱も殴れる（殴ると賽銭泥棒エンド）
  const sdx = 0 - P.x, sdz = -570.4 - P.z, sd = Math.hypot(sdx, sdz);
  const saisenHit = sd < 6.8 && (sdx * fx + sdz * fz) > 0 && (!best || bd > 2.2);
  if (saisenHit){
    if (saisenMesh){ saisenMesh.rotation.z = 0.16; saisenMesh.rotation.x = -0.1; }
    G.manners = Math.max(0, G.manners - 20); updateMannersPill();
    popup('賽銭箱を殴った！', 'bad');
    tone(1560, 0.3, 'square', 0.06); tone(2093, 0.4, 'sine', 0.06); noiseBurst(0.15, 2400, 0.15);
    if (G.phase === 'run'){
      G.endKind = 'saisen'; G.phase = 'dead'; G.deadT = 0;
      $('punchBtn').style.display = 'none';
      $('dashBtn').style.display = 'none';
      G.dashHeld = false;
      $('stickL').style.display = 'none';
    }
  } else if (shopHit && (!best || shopD < bd)){
    shopHit.hits++;
    shopHit.shakeT = 1.1;
    G.manners = Math.max(0, G.manners - 15); updateMannersPill();
    tone(85, 0.22, 'sine', 0.16, -30); noiseBurst(0.12, 300, 0.2);
    if (shopHit.hits >= 3){
      shopHit.broken = true;
      shopHit.grp.position.y -= 0.55;
      shopHit.grp.rotation.z = 0.09;
      popup('店の壁が壊れた！', 'bad');
      noiseBurst(0.4, 500, 0.3); tone(60, 0.5, 'sine', 0.2, -20);
      if (G.phase === 'run'){
        G.endKind = 'shop'; G.phase = 'dead'; G.deadT = 0;
        $('punchBtn').style.display = 'none';
        $('dashBtn').style.display = 'none';
        G.dashHeld = false;
        $('stickL').style.display = 'none';
      }
    } else {
      popup('店を殴った！', 'bad');
    }
  } else if (tHit && (!best || td < bd)){
    tHit.shakeT = 1.1;
    G.toriiPunches++;
    G.manners = Math.max(0, G.manners - 20); updateMannersPill();
    popup('鳥居を殴った！', 'bad');
    if (tHit.metal){ tone(1150, 0.5, 'sine', 0.09); tone(1890, 0.35, 'sine', 0.05); }
    else { tone(85, 0.22, 'sine', 0.16, -30); noiseBurst(0.12, 300, 0.2); }
    if (G.toriiPunches >= 3 && G.phase === 'run'){
      strikeBolt();
      G.endKind = 'bachi'; G.phase = 'dead'; G.deadT = 0;
      P.flyV = 8; P.spin = rnd(7, 10); P.vx = -fx * 3; P.vz = -fz * 3;
      $('punchBtn').style.display = 'none';
      $('dashBtn').style.display = 'none';
      G.dashHeld = false;
      $('stickL').style.display = 'none';
    }
  } else if (best){
    const dx = best.x - P.x, dz = best.z - P.z, d = Math.max(0.3, Math.hypot(dx, dz));
    best.kbx = dx / d * 30; best.kbz = dz / d * 30;
    best.flyV = 13; best.flyY = 0.02; best.flyRot = 0; best.spin = rnd(9, 14) * (Math.random() < 0.5 ? -1 : 1);
    best.stumbleT = 2.0;
    G.punches++;
    G.manners = Math.max(0, G.manners - 10); updateMannersPill();
    popup('殴った！', 'bad');
    if ((best.photo > 0 || best.isPhotog) && G.phase === 'run'){
      const pg = NPCS.find(n => n.isPhotog && n.photo > 0);
      if (pg) doFlash(pg);
      G.flameSpot = pg ? { x: pg.x, z: pg.z - 4.3 } : { x: best.x, z: best.z }; // for the share photo's re-enactment
      G.endKind = 'flame'; G.phase = 'dead'; G.deadT = 0;
      $('punchBtn').style.display = 'none';
      $('dashBtn').style.display = 'none';
      G.dashHeld = false;
      $('stickL').style.display = 'none';
    } else if (G.punches >= 10 && G.phase === 'run'){
      G.endKind = 'report'; G.phase = 'dead'; G.deadT = 0;
      $('punchBtn').style.display = 'none';
  $('dashBtn').style.display = 'none';
  G.dashHeld = false;
      $('dashBtn').style.display = 'none';
      $('stickL').style.display = 'none';
    }
  }
}

const dashBtnEl = $('dashBtn');
dashBtnEl.addEventListener('pointerdown', e => { e.preventDefault(); try{ dashBtnEl.setPointerCapture(e.pointerId); }catch(_){} G.dashHeld = true; dashBtnEl.classList.add('on'); });

/* ================= 参拝（二礼四拍手一礼は表示しない。覚えているかだけ） ================= */
function prayTap(kind){
  if (G.phase !== 'pray') return;
  if (kind === '礼'){ P.bowT = 0.55; sndBow(); } else { P.clapT = 0.3; sndClap(); }
  if (PRAY_SEQ[G.prayIdx] !== kind) G.prayMiss++;
  G.prayIdx++;
  if (G.prayIdx >= PRAY_SEQ.length) finishPray();
}
$('bowBtn').addEventListener('click', ()=> prayTap('礼'));
$('clapBtn').addEventListener('click', ()=> prayTap('拍'));
function startPray(){
  G.phase = 'pray';
  $('prayUI').style.display = 'flex';
  $('stickL').style.display = 'none';
  $('punchBtn').style.display = 'none';
  $('dashBtn').style.display = 'none';
  G.dashHeld = false;
}
function finishPray(){
  $('prayUI').style.display = 'none';
  if (G.manners === 100 && G.prayMiss === 0){
    G.endKind = 'god'; G.phase = 'god'; G.godT = 0;
    GOD.grp.visible = true;
    tone(1568, 1.6, 'sine', 0.10); tone(2093, 2.0, 'sine', 0.07); tone(1046, 2.4, 'sine', 0.06);
    return;
  }
  G.phase = 'done';
  sndGoal();
  setTimeout(showResult, 700);
}

/* ================= メインループ ================= */
const clock = new THREE.Clock();
let titleAngle = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  applySky();

  if (G.phase === 'title'){
    titleAngle += dt * 0.02;
    const cx = 21 + Math.sin(titleAngle) * 1.5;
    camera.position.set(cx, groundY(0) + 6.0, 30);
    camera.lookAt(-2, groundY(-18) + 2.5, -18);
    player.position.set(0, groundY(13), 13);
    player.rotation.y = Math.PI;
    player.rotation.x = 0;
  } else if (G.phase === 'intro'){
    G.introT += dt;
    const k = 1 - Math.pow(0.02, dt);
    camera.position.x = lerp(camera.position.x, P.x * 0.82, k);
    camera.position.y = lerp(camera.position.y, groundY(P.z) + 3.6, k);
    camera.position.z = lerp(camera.position.z, P.z + 8.4, k);
    camera.lookAt(P.x * 0.9, groundY(P.z) + 1.5, P.z - 4);
    player.position.set(P.x, groundY(P.z), P.z);
    player.rotation.y = 0;
    if (G.introT >= 1.5){
      G.phase = 'run';
      const sp = $('startPop');
      sp.style.display = 'block';
      sp.style.animation = 'none'; void sp.offsetWidth; sp.style.animation = '';
      setTimeout(()=> sp.style.display = 'none', 1250);
    }
  } else if (G.phase === 'run' || G.phase === 'pray' || G.phase === 'done' || G.phase === 'dead' || G.phase === 'god'){
    if (G.phase === 'run'){
      G.time += dt;
      $('timePill').textContent = G.time.toFixed(1) + '秒';
      G.clockMin = Math.min(1140, 960 + G.time * 1.5); // 実120秒で16:00→19:00（空だけ夜へ、時刻表示なし）
      if (G.time >= 120){
        G.endKind = 'gate'; G.phase = 'dead'; G.deadT = 0;
        $('punchBtn').style.display = 'none';
        $('dashBtn').style.display = 'none';
        G.dashHeld = false;
        $('stickL').style.display = 'none';
      }
      // 入力ベクトル（画面上が北＝-z）
      let ix = 0, iz = 0;
      if (stick.active){ ix = stick.dx; iz = stick.dy; }
      if (keys['arrowleft'] || keys['a']) ix -= 1;
      if (keys['arrowright'] || keys['d']) ix += 1;
      if (keys['arrowup'] || keys['w']) iz -= 1;
      if (keys['arrowdown'] || keys['s']) iz += 1;
      const il = Math.hypot(ix, iz);
      if (il > 1){ ix /= il; iz /= il; }
      const mag = Math.min(1, il);
      // ダッシュは押している間ずっと（スタミナなし）
      if (P.dashOn){ if (!G.dashHeld || mag < 0.1) P.dashOn = false; }
      else if (G.dashHeld && mag > 0.1) P.dashOn = true;
      P.speedMul = lerp(P.speedMul, P.dashOn ? 1.8 : 1, 1 - Math.pow(P.dashOn ? 2e-7 : 0.001, dt));
      const speed = 6.5 * P.speedMul * Math.max(mag, il > 0 ? 0.35 : 0);
      const tx = ix * speed, tz = iz * speed;
      const vRate = 1 - Math.pow(2e-7, dt);
      P.vx = lerp(P.vx, tx, vRate);
      P.vz = lerp(P.vz, tz, vRate);
      P.x += P.vx * dt; P.z += P.vz * dt;
      const w = widthAt(P.z);
      P.x = clamp(P.x, -w, w);
      P.z = clamp(P.z, -566.6, 14);
      if (il > 0.08){
        const targetA = Math.atan2(-P.vx, -P.vz);
        let da = targetA - P.angle;
        while (da > Math.PI) da -= Math.PI*2;
        while (da < -Math.PI) da += Math.PI*2;
        P.angle += da * Math.min(1, dt*14);
      }
      // 鳥居通過ポップ
      for (const tp of TORII_POPUPS){
        if (!G.toriiSeen[tp.z] && P.z < tp.z + 1 && P.z > tp.z - 6){ G.toriiSeen[tp.z] = true; }
      }
      // 人混みの波
      for (const wv of WAVE_POPUPS){
        if (!G.waveSeen[wv.z] && P.z < wv.z){ G.waveSeen[wv.z] = true; }
      }
      // 中央（神様の道）チェック
      if (P.z < -376 && P.z > -563 && Math.abs(P.x) < 1.35){ // 賽銭箱の前（お参りする場所）は真ん中でもいい
        G.centerAcc += dt;
        if (G.warnCd <= 0){ sndWarn(); G.warnCd = 2.2; }
        while (G.centerAcc >= 0.5){
          G.centerAcc -= 0.5; G.centerTicks++;
          G.manners = Math.max(0, G.manners - 1); updateMannersPill();
        }
      } else G.centerAcc = 0;
      if (G.warnCd > 0) G.warnCd -= dt;
      if (G.bumpCd > 0) G.bumpCd -= dt;
      // ゴール判定
      if (P.z <= -565.2 && Math.abs(P.x) < 5) startPray();
      // HUD

      const zn = zoneName(P.z);
      if (zn !== G.zone){ G.zone = zn; $('zonePill').textContent = zn; }
    }
    // 事故の吹っ飛び
    if (G.phase === 'dead'){
      G.deadT += dt;
      P.x += P.kbx * dt; P.z += P.kbz * dt;
      P.kbx *= Math.pow(0.08, dt); P.kbz *= Math.pow(0.08, dt);
      if (P.flyY > 0 || P.flyV > 0){
        P.flyV -= 22 * dt; P.flyY += P.flyV * dt; P.flyRot += P.spin * dt;
        if (P.flyY <= 0){ P.flyY = 0; P.flyV = 0; if (G.phase === 'dead') P.flyRot = Math.PI / 2 + Math.round((P.flyRot - Math.PI / 2) / Math.PI) * Math.PI; }
      }
      if (G.deadT > (G.endKind === 'bachi' ? 2.7 : 1.6)) showResult(true);
    }
    // 神様降臨（特別エンド演出）
    if (G.phase === 'god'){
      G.godT += dt;
      const gt = Math.min(1, G.godT / 2.6);
      GOD.grp.position.y = groundY(-570.5) + (1 - gt) * 4.2;
      GOD.light.intensity = gt * 2.4;
      GOD.glow.material.opacity = 0.2 + gt * 0.6;
      if (P.bowT <= 0) P.bowT = 0.55;
      if (G.godT > 3.4){ G.phase = 'done'; sndGoal(); showResult(false); }
    }
    // プレイヤー描画
    const gy = groundY(P.z);
    player.position.set(P.x, gy + (P.clapT > 0 ? Math.abs(Math.sin(P.clapT*20))*0.05 : 0), P.z);
    if (G.phase === 'pray' || G.phase === 'done' || G.phase === 'god'){
      player.rotation.y = 0; // 拝殿（北）を向く
      if (P.bowT > 0){ P.bowT -= dt; player.rotation.x = -Math.sin(Math.min(1, (0.55-P.bowT)/0.55) * Math.PI) * 0.55; }
      else player.rotation.x = 0;
      if (P.clapT > 0) P.clapT -= dt;
    } else {
      player.rotation.y = P.angle;
      const spd = Math.hypot(P.vx, P.vz);
      P.phase += dt * Math.min(0.8 + spd * 0.42, 5.6);
      const ph = P.phase;
      swingLimbs(player, ph, clamp(spd/8, 0, 1.15) * 0.55);
      player.rotation.x = -clamp(spd * 0.013, 0, 0.17); // 走りの前傾
      player.position.y = gy + Math.abs(Math.sin(ph)) * 0.045 * clamp(spd/7,0,1.2);
      if (P.punchT > 0){
        P.punchT -= dt;
        const pp = 1 - Math.max(0, P.punchT) / 0.28;
        const ext = pp < 0.22 ? pp / 0.22 : (pp < 0.55 ? 1 : 1 - (pp - 0.55) / 0.45);
        player.userData.parts.armR.rotation.x = 1.55 * ext;
        player.rotation.y += 0.22 * ext;
        player.rotation.x -= 0.10 * ext;
      }
      if (P.punchCd > 0) P.punchCd -= dt;
      if (G.phase === 'dead'){ player.position.y = gy + P.flyY; player.rotation.x = P.flyRot; }
    }
    // カメラ
    const back = (G.phase === 'run' || G.phase === 'dead') ? 8.4 : 4.8;
    const camTX = P.x * 0.82, camTZ = P.z + back;
    camera.position.x = lerp(camera.position.x, camTX, 1 - Math.pow(0.001, dt));
    camera.position.z = lerp(camera.position.z, camTZ, 1 - Math.pow(0.001, dt));
    camera.position.y = lerp(camera.position.y, groundY(P.z) + ((G.phase === 'run' || G.phase === 'dead') ? 3.6 : 2.9), 1 - Math.pow(0.001, dt));
    camera.lookAt(P.x * 0.9, groundY(P.z) + ((G.phase === 'run' || G.phase === 'dead') ? 1.5 : 2.1), P.z - 4);
  }

  // 写真撮影グループの出現管理
  if (G.phase === 'run'){
    G.photoCd -= dt;
    if (G.photoCd <= 0){
      G.photoCd = rnd(5, 9);
      if (!NPCS.some(n => n.photo > 0)){
        const spot = PHOTO_SPOTS.find(s => s.z < P.z - 16 && s.z > P.z - 80);
        if (spot) formPhotoGroup(spot);
      }
    }
  }
  // 人混み更新（タイトルでも流す）
  for (const n of NPCS){
    if (G.phase !== 'title' && n.photo <= 0 && (n.z > P.z + 20 || (n.dir < 0 && n.z < -565) || n.z < P.z - 110)) spawnNPC(n, false);
    if (G.phase === 'title' && n.z > 14) n.z = -100 + rnd(0, 12);
    if (G.phase === 'title' && n.z < -566) n.z = 10;
    if (n.photo > 0){
      n.photo -= dt;
      n.z += n.kbz * dt;
      if (n.isPhotog){
        n.flashCd -= dt;
        if (n.flashCd <= 0){ doFlash(n); n.flashCd = rnd(1.6, 3.2); }
      }
      if (n.photo <= 0) endPhoto(n);
    } else {
      n.z += n.dir * n.speed * dt * (G.phase === 'title' ? 0.7 : 1) + n.kbz * dt;
    }
    // 近づくと人が少しよけてくれる（人の壁で完全停止しない）
    if (G.phase === 'run' && n.photo <= 0 && n.flyY <= 0 && n.tipT <= 0){
      const pdx = n.x - P.x, pdz = n.z - P.z, pd2 = pdx*pdx + pdz*pdz;
      if (pd2 < 2.6 && pd2 > 0.001){
        const pd = Math.sqrt(pd2);
        const partMul = n.z < -376 ? 1.7 : 1;
        n.kbx += (pdx / pd) * 4.4 * partMul * dt;
        n.kbz += (pdz / pd) * 1.1 * dt;
      }
    }
    n.laneX += n.kbx * dt;
    n.kbx *= Math.pow(0.08, dt); n.kbz *= Math.pow(0.08, dt);
    n.laneX = clamp(n.laneX, -7.4, 7.4);
    n.z = clamp(n.z, -570, 16);
    n.x = n.laneX + Math.sin(t*0.9 + n.phase) * 0.28;
    const gy = groundY(n.z);
    let rock = Math.sin(t*5.2 + n.phase) * 0.045;
    if (n.stumbleT > 0){ n.stumbleT -= dt; rock = Math.sin(n.stumbleT*30) * 0.22; }
    // 吹っ飛び（放物線＋回転）
    let tipX = 0;
    if (n.flyY > 0 || n.flyV > 0){
      n.flyV -= 22 * dt;
      n.flyY += n.flyV * dt;
      n.flyRot += n.spin * dt;
      tipX = n.flyRot;
      if (n.flyY <= 0){ n.flyY = 0; n.flyV = 0; n.flyRot = 0; n.tipT = 0.9; }
    } else if (n.tipT > 0){
      n.tipT -= dt; tipX = Math.sin(Math.min(1, (0.9 - n.tipT) / 0.9) * Math.PI) * 1.15;
    }
    n.grp.position.set(n.x, gy + Math.abs(Math.sin(t*5.2 + n.phase)) * 0.04 + n.flyY, n.z);
    if (n.photo > 0 && n.flyY <= 0){
      // 撮影中ポーズ（カメラマンは腕を上げて構える）
      const p = n.grp.userData.parts;
      p.legL.rotation.x = 0; p.legR.rotation.x = 0; p.armL.rotation.x = 0;
      p.armR.rotation.x = n.isPhotog ? 2.35 : (n.poseArm ? 2.8 : 0);
      n.grp.rotation.set(tipX, n.photoRy, 0);
    } else {
      const lean = (n.runner && n.flyY <= 0 && n.tipT <= 0) ? (n.dir > 0 ? 0.13 : -0.13) : 0;
      n.grp.rotation.set(tipX + lean, n.dir > 0 ? Math.PI : 0, rock);
      if (n.runner) swingLimbs(n.grp, t * Math.min(1.2 + n.speed * 0.5, 7.0) + n.phase, 0.9);
      else swingLimbs(n.grp, t*3.1 + n.phase, 0.32);
    }
    // 接触判定
    if (G.phase === 'run' && G.bumpCd <= 0){
      const dx = n.x - P.x, dz = n.z - P.z;
      if (dx*dx + dz*dz < 0.42){
        G.bumpCd = 0.7; G.bumps++;
        if (P.dashOn){
          G.dashBumps++;
          if (G.dashBumps >= 5){
            G.endKind = 'fall'; G.phase = 'dead'; G.deadT = 0;
            P.flyV = 7; P.flyY = 0.02; P.flyRot = 0; P.spin = rnd(6, 9);
            P.kbx = P.vx * 0.6; P.kbz = P.vz * 0.6;
            $('punchBtn').style.display = 'none';
            $('dashBtn').style.display = 'none';
            G.dashHeld = false;
            $('stickL').style.display = 'none';
          }
        }
        G.manners = Math.max(0, G.manners - 4); updateMannersPill();
        n.stumbleT = 0.55;
        P.vx *= 0.55; P.vz *= 0.55;
        popup('ぶつかった！', 'bad'); sndBump();
      }
    }
  }
  updateCrossCars(dt);
  updateToriis(dt);
  updateShops(dt);
  if (G.boltT > 0){
    const prevBoltT = G.boltT;
    G.boltT -= dt;
    boltGrp.visible = (2.2 - G.boltT) < 0.5 || Math.random() > 0.22; // 最初はしっかり、後はちらつき
    if (prevBoltT > 1.6 && G.boltT <= 1.6){ // 二度目の落雷
      G.flashT = 0.5;
      boltGrp.rotation.y = rnd(0, 6.28); boltGrp.scale.x = rnd(0.8, 1.35);
      noiseBurst(0.4, 200, 0.3); tone(48, 0.7, 'sine', 0.26, -12);
    }
    if (sparks.visible){
      const pos = sparkGeo.attributes.position.array;
      for (let i = 0; i < 14; i++){
        sparkVel[i][1] -= 9 * dt;
        pos[i*3] += sparkVel[i][0] * dt; pos[i*3+1] += sparkVel[i][1] * dt; pos[i*3+2] += sparkVel[i][2] * dt;
      }
      sparkGeo.attributes.position.needsUpdate = true;
      sparkMat.opacity = Math.max(0, Math.min(1, G.boltT));
      if (G.boltT <= 0.9) sparks.visible = false;
    }
    if (G.boltT <= 0){ boltGrp.visible = false; sparks.visible = false; }
  }
  if (G.flashT > 0){ G.flashT -= dt; $('flash').style.opacity = Math.max(0, Math.min(1, G.flashT * 2.4)); if (G.flashT <= 0) $('flash').style.opacity = 0; }
  if (flashT > 0){
    flashT -= dt;
    flashMesh.material.opacity = Math.max(0, flashT / 0.16) * 0.85;
    flashMesh.scale.setScalar(1 + (0.16 - Math.max(0, flashT)) * 3);
    if (flashT <= 0) flashMesh.visible = false;
  }
  renderer.render(scene, camera);
}

function cleanName(raw){
  let name = (raw || '').trim().slice(0, 10);
  if (!name) return 'NONAME';
  const lower = name.toLowerCase();
  for (const w of NG_WORDS){
    if (lower.includes(w.toLowerCase())){
      // 直接ヒットはマスク、区切り回避などは差し替え
      if (name.includes(w)) return name.split(w).join('＊'.repeat(w.length)).slice(0,10);
      return 'NONAME';
    }
  }
  return name;
}

async function loadRanking(el){
  if (RANK_SHEET_ID === 'PENDING') { el.textContent = '準備中…'; return; }
  el.textContent = '読み込み中…';
  try {
    const res = await fetch('https://docs.google.com/spreadsheets/d/' + RANK_SHEET_ID + '/gviz/tq?tqx=out:json&headers=1&_=' + Date.now());
    const txt = await res.text();
    const json = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
    const rows = json.table.rows || [];
    const best = new Map();
    for (const r of rows){
      const c = r.c || [];
      const name = c[1] && c[1].v != null ? String(c[1].v) : 'NONAME';
      const score = c[2] && c[2].v != null ? Number(c[2].v) : NaN;
      const pid = c[3] && c[3].v != null ? String(c[3].v) : '';
      if (!pid || isNaN(score)) continue;
      // 新形式のみ：上位=おみくじ順位（0神吉…6凶）、下6桁=タイム(0.1秒)。おみくじ以外のエンドと旧形式は載せない
      const rk = Math.floor(score / 1000000), tt = score % 1000000;
      if (score < 0 || rk > 6 || tt > 1200) continue;
      if (!best.has(pid) || score < best.get(pid).score) best.set(pid, { name, score, pid });
    }
    const list = [...best.values()].sort((a,b)=> a.score - b.score).slice(0, 20);
    const mypid = playerId();
    const myBestScore = Number(storeGet('izumo_best2') || -1);
    const mineE = best.get(mypid);
    if (myBestScore >= 0 && (!mineE || mineE.score > myBestScore)) formPost(myBestScore); // 送信ロスト時の再送（シート照合）
    if (!list.length){ el.textContent = 'まだ記録がありません'; return; }
    const RANK_LABEL = ['神吉','大吉','吉','中吉','小吉','末吉','凶'];
    el.innerHTML = list.map((r, i)=>{
      const rk = Math.floor(r.score / 1000000), tt = r.score % 1000000;
      return `<div class="${r.pid === mypid ? 'me' : ''}">${i+1}位　${r.name}　${RANK_LABEL[rk]}　${(tt / 10).toFixed(1)}秒</div>`;
    }).join('');
  } catch(e){ el.textContent = '読み込みに失敗しました'; }
}

  let hitCar = null, hitCarX = 0;
  let staged = null; // flame re-enactment: NPCs re-posed for the shot, restored after
  let stagedPlayer = false; // pillar photo: player shifted clear of a torii pillar for the shot, restored after
  if (G.endKind === 'flame' && G.flameSpot){
    const spot = G.flameSpot, gy = groundY(spot.z);
    staged = [];
    const near = NPCS.slice().sort((a, b) => (Math.abs(a.x - spot.x) + Math.abs(a.z - spot.z)) - (Math.abs(b.x - spot.x) + Math.abs(b.z - spot.z))).slice(0, 5);
    const offs = [[-1.3, 0], [0.2, 0.55], [1.5, -0.3], [-0.5, -0.95]];
    near.forEach((n, i) => {
      staged.push({ n, x: n.x, z: n.z, photo: n.photo, isPhotog: n.isPhotog, poseArm: n.poseArm, phone: n.phoneMesh ? n.phoneMesh.visible : false, gx: n.grp.position.x, gy: n.grp.position.y, gz: n.grp.position.z, gry: n.grp.rotation.y });
      if (i < 4){ n.x = spot.x + offs[i][0]; n.z = spot.z + offs[i][1]; n.photoRy = Math.PI; n.isPhotog = false; n.poseArm = i === 1; if (n.phoneMesh) n.phoneMesh.visible = false; }
      else { n.x = spot.x + 0.1; n.z = spot.z + 4.3; n.photoRy = 0; n.isPhotog = true; if (n.phoneMesh) n.phoneMesh.visible = true; }
      n.grp.position.set(n.x, groundY(n.z), n.z);
      n.grp.rotation.set(0, n.photoRy, 0);
    });
    flashSprite.position.set(spot.x + 0.1, gy + 1.55, spot.z + 3.8);
    flashSprite.visible = true;
    camera.position.set(spot.x - 3.4, gy + 3.4, spot.z + 11.5);
    camera.lookAt(spot.x + 0.3, gy + 1.1, spot.z + 1.6);
    renderer.render(scene, camera);
  } else {
    let tx = P.x, tz = P.z;
    if (G.endKind === 'car' && G.hitCar){
      hitCar = G.hitCar; hitCarX = hitCar.x;
      hitCar.x = P.x + hitCar.dir * 5.2; // the car that hit the player, placed just past them for the photo
      hitCar.grp.position.x = hitCar.x;
      hitCar.grp.position.y = groundY(hitCar.z);
      tx = (P.x + hitCar.x) / 2; tz = (P.z + hitCar.z) / 2;
      camera.position.set(tx + 3.2, groundY(tz) + 4.6, tz + 11.0); // wider: both the player and the car have to fit
      camera.lookAt(tx, groundY(tz) + 0.4, tz);
    } else {
      // a pillar on the sight line hides the player completely (bachi at a pillar was invisible) — handle pillars explicitly
      let nearP = null, nearD = 1e9;
      for (const t of TORIIS) for (const px of [t.w / 2, -t.w / 2]){ const d = Math.hypot(px - tx, t.z - tz); if (d < nearD){ nearD = d; nearP = { x: px, z: t.z }; } }
      if (nearD < 2.4){
        // staged photo (same idea as the car/flame stagings): shift the player clear of the pillar, shoot from the open side, restore after the render
        const dx = tx - nearP.x, dz = tz - nearP.z, dl = Math.hypot(dx, dz);
        const ux = dl < 0.05 ? 0 : dx / dl, uz = dl < 0.05 ? 1 : dz / dl;
        tx = nearP.x + ux * 2.7; tz = nearP.z + uz * 2.7;
        player.position.set(tx, groundY(tz) + (P.flyY || 0), tz);
        stagedPlayer = true;
        const gyS = groundY(tz);
        camera.position.set(tx + ux * 6.2 - uz * 2.3, gyS + 3.8, tz + uz * 6.2 + ux * 2.3);
        camera.lookAt(tx, gyS + 0.4, tz);
      } else {
        const gyT = groundY(tz);
        const cands = [[4.4, 7.8, 3.6], [-4.4, 7.8, 3.6], [4.4, -7.8, 3.6], [-4.4, -7.8, 3.6], [0, 10.5, 6.2], [0, -10.5, 6.2]];
        let bestC = cands[0], bestClear = -1;
        for (const c of cands){
          const cx = tx + c[0], cz = tz + c[1];
          let clear = 1e9;
          for (const t of TORIIS) for (const px of [t.w / 2, -t.w / 2]){
            const vx = tx - cx, vz = tz - cz, wx = px - cx, wz = t.z - cz;
            const tt = Math.max(0, Math.min(1, (wx * vx + wz * vz) / ((vx * vx + vz * vz) || 1)));
            clear = Math.min(clear, Math.hypot(px - (cx + vx * tt), t.z - (cz + vz * tt)));
          }
          if (clear > bestClear){ bestClear = clear; bestC = c; }
          if (clear > 1.0) break;
        }
        camera.position.set(tx + bestC[0], gyT + bestC[2], tz + bestC[1]);
        camera.lookAt(tx, gyT + 0.4, tz);
      }
    }
    renderer.render(scene, camera);
  }
  const src = renderer.domElement;
  const scale = Math.max(S / src.width, S / src.height);
  const dw = src.width * scale, dh = src.height * scale;
  g.drawImage(src, (S - dw)/2, (S - dh)/2, dw, dh);
  const grad = g.createLinearGradient(0, S*0.52, 0, S);
  grad.addColorStop(0, 'rgba(10,10,20,0)'); grad.addColorStop(0.45, 'rgba(10,10,20,0.88)');
  g.fillStyle = grad; g.fillRect(0, S*0.52, S, S*0.48);
  g.textAlign = 'center'; g.fillStyle = '#fff';
  g.font = '900 64px sans-serif';
  g.fillText('⛩️ 出雲大社 初詣', S/2, S*0.70);
  if (lastResult){
    g.font = '900 120px sans-serif'; g.fillStyle = '#ffd94d';
    g.fillText((lastResult.score !== null && lastResult.score !== undefined ? 'おみくじ ' : '') + lastResult.tier.omikuji, S/2, S*0.83);
    g.font = '700 52px sans-serif'; g.fillStyle = '#fff';
    g.fillText(`「${lastResult.tier.title}」 ${lastResult.time.toFixed(1)}秒`, S/2, S*0.92);
  }
  if (hitCar){ hitCar.x = hitCarX; hitCar.grp.position.x = hitCarX; hitCar.grp.position.y = groundY(hitCar.z); }
  if (stagedPlayer){ player.position.set(P.x, groundY(P.z) + (P.flyY || 0), P.z); stagedPlayer = false; }
  if (staged){
    for (const s of staged){ const n = s.n; n.x = s.x; n.z = s.z; n.photo = s.photo; n.isPhotog = s.isPhotog; n.poseArm = s.poseArm; if (n.phoneMesh) n.phoneMesh.visible = s.phone; n.grp.position.set(s.gx, s.gy, s.gz); n.grp.rotation.y = s.gry; }
    flashSprite.visible = false;
  }
  camera.position.copy(camPos);
  camera.lookAt(P.x * 0.9, groundY(P.z) + ((G.phase === 'run' || G.phase === 'dead') ? 1.5 : 2.1), P.z - 4);
  renderer.render(scene, camera);
  return cv;
}
$('shareBtn').addEventListener('click', ()=>{
  const shareText = shareUrl;
  try {
    const cv = buildShareImage();
    cv.toBlob(async blob => {
      const file = new File([blob], 'izumo.png', { type:'image/png' });
      if (navigator.canShare && navigator.canShare({ files:[file] })){
        try { await navigator.share({ files:[file], text: decodeURIComponent(shareText.split('text=')[1] || '') }); return; } catch(e){}
      }
      window.open(shareText, '_blank');
    });
  } catch(e){ window.open(shareText, '_blank'); }
});

  ac(); startAmb();
  storeSet('izumo_name', $('nameInput').value.trim());
  G.phase = 'intro'; G.introT = 0; G.time = 0; G.clockMin = 960; G.manners = 100; G.bumps = 0; G.dashBumps = 0; G.resultShown = false; G.punches = 0; G.toriiPunches = 0; G.centerTicks = 0; G.centerAcc = 0;
  if (saisenMesh){ saisenMesh.rotation.z = 0; saisenMesh.rotation.x = 0; }
  for (const s of SHOPS){ s.hits = 0; s.broken = false; s.shakeT = 0; s.grp.rotation.z = 0; s.grp.position.y = groundY(s.z); }
  G.bumpCd = 0; G.warnCd = 0; G.prayIdx = 0; G.prayMiss = 0; G.toriiSeen = {}; G.waveSeen = {}; G.zone = '';
  G.endKind = null; G.godT = 0; G.dashHeld = false; dashBtnEl.classList.remove('on');
  GOD.grp.visible = false; GOD.light.intensity = 0; GOD.glow.material.opacity = 0;
  P.x = 0; P.z = 13; P.vx = 0; P.vz = 0; P.angle = 0; P.stamina = 100; P.bowT = 0; P.clapT = 0; P.punchT = 0; P.punchCd = 0;
  P.kbx = 0; P.kbz = 0; P.flyY = 0; P.flyV = 0; P.flyRot = 0; G.deadT = 0;
  P.dashOn = false; P.speedMul = 1; P.magSm = 0;
  $('punchBtn').style.display = 'block';
  $('dashBtn').style.display = 'block';
  for (const n of NPCS) spawnNPC(n, true);
  camera.position.set(21, groundY(13) + 6.0, 34);
  $('titleScr').style.display = 'none';
  $('resultScr').style.display = 'none';
  $('rankScr').style.display = 'none';
  $('hud').style.display = 'flex';
  $('zonePill').textContent = '神門通り';
  $('timePill').textContent = '0.0秒';
  updateMannersPill();
}

  G.phase = 'title';
  $('hud').style.display = 'none';

  $('dashBtn').style.display = 'none';

  $('resultScr').style.display = 'none';
  $('rankScr').style.display = 'none';

}

if (new URLSearchParams(location.search).has('dbg')) window.__G = { G, P, NPCS, SHOPS, boltGrp, CROSS_CARS, TORIIS, PHOTO_SPOTS, formPhotoGroup, player, scene, startGame, startPray, prayTap, punch, showResult, groundY, buildShareImage,
  acState: () => AC ? AC.state : 'none', bgmOn: () => !!ambNodes,
  armVec: () => { const p = player.userData.parts; const v = new THREE.Vector3(), s = new THREE.Vector3();
    p.armR.children[1].getWorldPosition(v); p.armR.getWorldPosition(s);
    return { rotX: +p.armR.rotation.x.toFixed(2), dx: +(v.x - s.x).toFixed(2), dy: +(v.y - s.y).toFixed(2), dz: +(v.z - s.z).toFixed(2) }; } };
